name: Frontend CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    # Run CI for PRs targeting main. This covers develop -> main flow.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build